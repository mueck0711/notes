title: ビットコイン経済研究所
# 英語名。今はトップの <title> だけで使う（他の使いどころは未定）。
title_en: Bitcoin Economics Research Institute
tagline: ビットコインを市場・経済・社会の側から読む。論考と、日次のマーケットレポート
description: ビットコインを市場・経済・社会の側から読む。論考と、日次のマーケットレポート。
url: https://bitcoin-economics.org
# 独自ドメインはサイトをドメイン直下で配信するので baseurl は空 → docs/adr/S-0003
baseurl: ""
lang: ja

x_username: BTC_Economics

# card.png の無いページ（articles・トップ・一覧・旧レポート）の既定 og:image。
og_image: /assets/img/og-default.png

# GA4 の測定 ID。空にすると _includes/analytics.html が何も出さない。
# タグが出るのは production ビルドのときだけ（ローカルの検証は計測しない）。
# 測定 ID は元々ページのソースに出る公開値なので、Public リポジトリに置いてよい。
google_analytics: G-B1FX4R34FF

# GitHub Pages のブランチビルドでは既定で有効。ローカルの検証ビルドと挙動を揃えるため明示する。
#   optional-front-matter … front matter の無い .md を描画する（BMA が生成する
#                            market-reports/*/README.md は front matter を持たない）
#   readme-index          … README.md をそのフォルダの index.html にする
#   sitemap               … sitemap.xml を生成する（検索エンジンへの通知用）。
#                           出力はビルド時生成なので .gitignore に穴を開ける必要はない。
plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-sitemap

# front matter が無いファイルにもレイアウトを与えるための唯一の口。
# 記事側に手を入れずに済むので、BMA の生成物をそのまま載せられる。
defaults:
  - scope:
      path: ''
    values:
      layout: page
  - scope:
      path: articles
    values:
      layout: post
  - scope:
      path: market-reports
    values:
      layout: post
  - scope:
      path: btc-news
    values:
      layout: post
  - scope:
      path: stablecoin-rwa
    values:
      layout: post
  # トップはカードタイルを持つ専用レイアウト。
  - scope:
      path: README.md
    values:
      layout: home
      # トップだけ専用の OGP 画像・文言を当てる。head.html は page.image / page.description を
      # 最優先で見るので、ここに置くだけで効く（head.html も README.md も無変更）。
      # 既定画像 og_image は articles 一覧・旧レポート等に残る（消していない）。
      # 画像の生成元は dev/notes-design/assets-src/og-home/。
      image: /assets/img/og-home.png
      image_alt: ビットコイン経済研究所 — 市場・経済・社会の側から、ビットコインを読む
      description: 市場・経済・社会の側から、ビットコインを読む。論考、日次のマーケットレポート、注目ニュース。
  # 各フォルダの一覧ページは記事ではないので page に戻す（より長いパスが勝つ）。
  # 論考だけはカテゴリ別のカードタイルを持つ専用レイアウト（→ dev/notes-design/docs/adr/0011）。
  - scope:
      path: articles/README.md
    values:
      layout: article-index
  - scope:
      path: market-reports/README.md
    values:
      layout: page
  - scope:
      path: btc-news/README.md
    values:
      layout: page
  - scope:
      path: stablecoin-rwa/README.md
    values:
      layout: page

kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
